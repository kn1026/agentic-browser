name: pr-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret & malware smell scan (diff)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
          fi
          echo "Scanning $BASE..$HEAD"
          FILES=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "$FILES"
          # Block committing secrets / env
          if echo "$FILES" | grep -E '(^|/)\.env($|\.)|id_rsa|id_ed25519|credentials\.json|\.pem$' ; then
            echo "::error::Blocked path looks like secrets"
            exit 1
          fi
          # Diff content heuristics (not perfect — agent review is required too).
          # Exclude workflow scanner files themselves so pattern lists don't self-match
          # (false green-kill on e004d07: pr-guard.yml matched curl|bash /dev/tcp etc.).
          DIFF=$(git diff "$BASE" "$HEAD" -- . \
            ':(exclude).github/workflows/pr-guard.yml' \
            ':(exclude).github/workflows/ci-fail-notify.yml' \
            || true)
          PATTERNS=(
            'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY'
            'AKIA[0-9A-Z]{16}'
            'xox[baprs]-'
            'ghp_[A-Za-z0-9]{20,}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'curl[^\n]*\|\s*(ba)?sh'
            'wget[^\n]*\|\s*(ba)?sh'
            '/dev/tcp/'
            'bash\s+-i\s+>&\s+/dev/tcp'
            'nc\s+-[el]'
            'powershell\s+-enc'
            'frombase64string'
            'eval\s*\(\s*base64'
            'rm\s+-rf\s+/'
            'chmod\s+777\s+/'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if echo "$DIFF" | grep -Eiq "$p"; then
              echo "::error::Suspicious pattern matched: $p"
              FAIL=1
            fi
          done
          # Large binary-ish added files
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            # skip known text
            case "$f" in
              *.py|*.md|*.yml|*.yaml|*.toml|*.txt|*.json|*.html|*.css|*.js|*.ts) continue ;;
            esac
            sz=$(wc -c <"$f" | tr -d ' ')
            if [ "$sz" -gt 200000 ]; then
              if file "$f" | grep -Eiq 'executable|ELF|PE32|Mach-O|archive|compressed'; then
                echo "::error::Large binary-like file added: $f ($sz bytes)"
                FAIL=1
              fi
            fi
          done <<< "$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" || true)"
          exit $FAIL

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (no browser)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest -q
